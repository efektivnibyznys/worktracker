name: Supabase encrypted backup

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Create encrypted database and logo backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          test -n "$BACKUP_PASSPHRASE"

          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          mkdir -p backups

          PGCONNECT_TIMEOUT=20 timeout 60s /usr/lib/postgresql/17/bin/pg_dump \
            --dbname "$SUPABASE_DB_URL" \
            --format custom \
            --no-password \
            --no-owner \
            --no-acl \
            --file "$work_dir/database.dump"

          node scripts/logo-storage-archive.mjs backup "$work_dir/logos"
          tar -C "$work_dir" -czf "$work_dir/worktracker-$timestamp.tar.gz" database.dump logos

          gpg \
            --batch \
            --yes \
            --symmetric \
            --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            --output "backups/worktracker-$timestamp.tar.gz.gpg" \
            "$work_dir/worktracker-$timestamp.tar.gz"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backups/*.tar.gz.gpg
          if-no-files-found: error
          retention-days: 90

      - name: Rehearse encrypted archive restore on manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          restore_dir="$(mktemp -d)"
          container="worktracker-restore-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$restore_dir"
          }
          trap cleanup EXIT

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_PASSPHRASE" \
            --decrypt --output "$restore_dir/archive.tar.gz" backups/*.tar.gz.gpg
          tar -xzf "$restore_dir/archive.tar.gz" -C "$restore_dir"
          test -s "$restore_dir/database.dump"
          node scripts/logo-storage-archive.mjs verify "$restore_dir/logos"

          docker run --rm --detach --name "$container" \
            -e POSTGRES_PASSWORD=restore-test-only \
            public.ecr.aws/supabase/postgres:17.6.1.166
          # The temporary initialization server accepts socket connections, then stops.
          # TCP becomes available only after initialization has finished.
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready -h 127.0.0.1 -U supabase_admin -d postgres >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker cp "$restore_dir/database.dump" "$container:/tmp/database.dump"
          docker exec "$container" createdb -U supabase_admin -T template0 worktracker_restore
          docker exec "$container" pg_restore -U supabase_admin -d worktracker_restore \
            --no-owner --no-acl --exit-on-error \
            /tmp/database.dump
          docker exec "$container" psql -U supabase_admin -d worktracker_restore -At \
            -c "SELECT 'restored clients=' || count(*) FROM public.clients" \
            -c "SELECT 'restored entries=' || count(*) FROM public.entries" \
            -c "SELECT 'restored invoices=' || count(*) FROM public.invoices" \
            -c "SELECT 'restored invoice items=' || count(*) FROM public.invoice_items"

          docker cp tests/sql/production_row_digest.sql "$container:/tmp/production_row_digest.sql"
          docker cp supabase/migrations/20260928_secure_invoices.sql "$container:/tmp/secure_invoices.sql"
          docker cp supabase/migrations/20260928_secure_logos.sql "$container:/tmp/secure_logos.sql"
          docker cp supabase/migrations/20261002_clean_invoice_descriptions.sql "$container:/tmp/invoice_descriptions.sql"
          before="$(docker exec "$container" psql -U supabase_admin -d worktracker_restore -At -v ON_ERROR_STOP=1 -f /tmp/production_row_digest.sql)"
          docker exec "$container" psql -U supabase_admin -d worktracker_restore -v ON_ERROR_STOP=1 -f /tmp/secure_invoices.sql
          docker exec "$container" psql -U supabase_admin -d worktracker_restore -v ON_ERROR_STOP=1 -f /tmp/secure_logos.sql
          docker exec "$container" psql -U supabase_admin -d worktracker_restore -v ON_ERROR_STOP=1 -f /tmp/invoice_descriptions.sql
          after="$(docker exec "$container" psql -U supabase_admin -d worktracker_restore -At -v ON_ERROR_STOP=1 -f /tmp/production_row_digest.sql)"
          test "$before" = "$after"
          echo 'Invoice and logo migrations passed on restored production data; all existing business and Storage metadata rows match.'
